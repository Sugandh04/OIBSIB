<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Create Account</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div id="toast-container"></div>

    <div class="split-container">
        <!-- Left Side: Form -->
        <div class="split-right">
            <div class="auth-box glass-panel">
                <h2>Join Nexus</h2>
                <p class="subtitle">Create an account to get started</p>

                <form id="registerForm">
                    <div class="input-group">
                        <i class="far fa-envelope icon"></i>
                        <input id="regEmail" type="email" placeholder="Email Address" required>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-lock icon"></i>
                        <input id="regPassword" type="password" placeholder="Password" required minlength="6" onkeyup="checkPasswordStrength(this.value)">
                        <i class="far fa-eye toggle-password" onclick="togglePasswordVisibility('regPassword', this)"></i>
                    </div>
                    
                    <div class="password-strength">
                        <div class="strength-bar-container">
                            <div class="strength-bar" id="strengthBar"></div>
                        </div>
                        <span id="strengthText">Password Strength</span>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-shield-alt icon"></i>
                        <input id="regConfirmPassword" type="password" placeholder="Confirm Password" required minlength="6">
                    </div>

                    <button type="submit" class="btn-primary">
                        Create Account <i class="fas fa-user-plus"></i>
                    </button>
                </form>

                <div class="social-login">
                    <p>Or sign up with</p>
                    <div class="social-btns">
                        <button class="btn-social" type="button" onclick="showToast('Google signup is a mock feature.', 'info')">
                            <i class="fab fa-google"></i> Google
                        </button>
                        <button class="btn-social" type="button" onclick="showToast('GitHub signup is a mock feature.', 'info')">
                            <i class="fab fa-github"></i> GitHub
                        </button>
                    </div>
                </div>

                <p class="auth-switch">Already have an account? <a href="login.html">Sign In</a></p>
            </div>
        </div>

        <!-- Right Side: Image / Branding -->
        <div class="split-left register-bg">
            <div class="branding">
                <div class="logo"><i class="fas fa-cube"></i> Nexus</div>
                <h1>Start Your Journey.</h1>
                <p>One account to manage all your tasks, projects, and productivity.</p>
            </div>
            <!-- Decorative shapes -->
            <div class="glass-orb orb-3"></div>
            <div class="glass-orb orb-4"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
