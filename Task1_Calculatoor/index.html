<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Scientific Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
  <!-- Animated background elements -->
  <div class="bg-shape shape1"></div>
  <div class="bg-shape shape2"></div>
  <div class="bg-shape shape3"></div>

  <div class="container">
    <div class="calculator glass-panel">
      <div class="top-bar">
        <button id="theme-toggle" onclick="toggleMode()" title="Toggle Theme" class="icon-btn">
          <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
      </div>

      <input type="text" id="display" disabled placeholder="0">

      <div class="buttons">
        <!-- Scientific Functions Row -->
        <button class="func" onclick="appendFunction('sqrt(')">√</button>
        <button class="func" onclick="appendValue('^')">^</button>
        <button class="func" onclick="appendFunction('log10(')">log</button>
        <button class="func" onclick="appendFunction('log(')">ln</button>
        
        <!-- Trigonometry Row -->
        <button class="func" onclick="appendFunction('sin(')">sin</button>
        <button class="func" onclick="appendFunction('cos(')">cos</button>
        <button class="func" onclick="appendFunction('tan(')">tan</button>
        <button class="op" onclick="appendValue('%')">%</button>
        
        <!-- Standard row 1 -->
        <button class="action clear" onclick="clearDisplay()">C</button>
        <button class="action" onclick="deleteLast()">DEL</button>
        <button class="func" onclick="appendValue('pi')">π</button>
        <button class="op" onclick="appendValue('/')">÷</button>
        
        <!-- Standard row 2 -->
        <button class="num" onclick="appendValue('7')">7</button>
        <button class="num" onclick="appendValue('8')">8</button>
        <button class="num" onclick="appendValue('9')">9</button>
        <button class="op" onclick="appendValue('*')">×</button>
        
        <!-- Standard row 3 -->
        <button class="num" onclick="appendValue('4')">4</button>
        <button class="num" onclick="appendValue('5')">5</button>
        <button class="num" onclick="appendValue('6')">6</button>
        <button class="op" onclick="appendValue('-')">−</button>
        
        <!-- Standard row 4 -->
        <button class="num" onclick="appendValue('1')">1</button>
        <button class="num" onclick="appendValue('2')">2</button>
        <button class="num" onclick="appendValue('3')">3</button>
        <button class="op" onclick="appendValue('+')">+</button>
        
        <!-- Standard row 5 -->
        <button class="func" onclick="appendValue('e')">e</button>
        <button class="num" onclick="appendValue('0')">0</button>
        <button class="num" onclick="appendValue('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>

        <button class="func brackets" onclick="appendValue('(')">(</button>
        <button class="func brackets" onclick="appendValue(')')">)</button>
      </div>
    </div>

    <div class="history glass-panel">
      <div class="history-header">
        <h3>History</h3>
        <button onclick="clearHistory()" class="icon-btn clear-history-btn" title="Clear History">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </div>
      <ul id="historyList"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
