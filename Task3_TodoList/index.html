<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart To-Do | Premium Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="dark">
    <!-- Animated Background Shapes -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <div class="app glass-panel">
        <header>
            <div class="header-title">
                <h1><i class="fas fa-check-double"></i> Smart Tasks</h1>
                <p>Organize your work with ease.</p>
            </div>

            <div class="controls">
                <div class="control-group search-group">
                    <i class="fas fa-search"></i>
                    <input id="search" placeholder="Search tasks...">
                </div>

                <div class="control-group">
                    <i class="fas fa-filter"></i>
                    <select id="filter">
                        <option value="all">All Priorities</option>
                        <option value="high">High Priority</option>
                        <option value="medium">Medium Priority</option>
                        <option value="low">Low Priority</option>
                    </select>
                </div>

                <div class="control-group">
                    <i class="fas fa-sort"></i>
                    <select id="sort">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="dueDate">Due Date</option>
                        <option value="priority">Priority</option>
                    </select>
                </div>

                <button id="themeToggle" class="icon-btn" title="Toggle Theme">
                    <i class="fas fa-sun"></i>
                </button>
            </div>
        </header>

        <div class="add-task-container glass-panel-inner">
            <input type="text" id="taskInput" placeholder="What needs to be done?" autocomplete="off">
            <div class="task-options">
                <div class="input-with-icon">
                    <i class="far fa-calendar-alt"></i>
                    <input type="date" id="dueDateInput" title="Due Date">
                </div>
                <select id="priority" class="priority-select">
                    <option value="low">🟢 Low Priority</option>
                    <option value="medium" selected>🟡 Medium Priority</option>
                    <option value="high">🔴 High Priority</option>
                </select>
                <button onclick="addTask()" class="btn-primary"><i class="fas fa-plus"></i> Add Task</button>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-stats">
                <span>Task Progress</span>
                <span id="progressText">0%</span>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>

        <div class="lists">
            <!-- Pending List -->
            <div class="list-container">
                <div class="list-header">
                    <h2><i class="fas fa-hourglass-half"></i> Pending <span class="badge pending-badge"
                            id="pendingCount">0</span></h2>
                </div>
                <ul id="pending" class="task-list dropzone" data-status="pending">
                    <!-- Tasks will be injected here -->
                </ul>
            </div>

            <!-- Completed List -->
            <div class="list-container">
                <div class="list-header completed-header">
                    <h2><i class="fas fa-check-circle"></i> Completed <span class="badge completed-badge"
                            id="completedCount">0</span></h2>
                </div>
                <ul id="completed" class="task-list dropzone" data-status="completed">
                    <!-- Tasks will be injected here -->
                </ul>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
